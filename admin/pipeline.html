<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Pipeline — Lina's Admin</title>
<link rel="icon" href="../assets/source/brand/Linas_Favicon.jpg">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="mobile-topbar">
  <button type="button" class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open menu">☰</button>
  <span class="mobile-topbar__title">Sales Pipeline</span>
</div>

<main class="admin-main">
  <h1 class="admin-title">Sales Pipeline</h1>
  <div class="admin-toolbar">
    <input type="search" id="searchBox" placeholder="Search name, phone, reference…" aria-label="Search pipeline" style="min-width:220px;">
    <select id="sourceFilter" aria-label="Filter by source"><option value="">All sources</option></select>
    <select id="typeFilter" aria-label="Filter by event type"><option value="">All event types</option></select>
  </div>
  <div id="pipelineBody"></div>
</main>

<div class="detail-panel" id="detailPanel" hidden role="dialog" aria-modal="true" aria-label="Enquiry details"></div>

<script type="module" src="js/pipeline.js"></script>
</body>
</html>
