<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotations — Lina's Admin</title>
<link rel="icon" href="../assets/source/brand/Linas_Favicon.jpg">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="mobile-topbar">
  <button type="button" class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open menu">☰</button>
  <span class="mobile-topbar__title">Quotations</span>
</div>

<main class="admin-main" id="quotationsMain">
  <h1 class="admin-title">Quotations</h1>
  <div id="accessDenied" hidden class="empty-state">Quotations are limited to owner/admin accounts.</div>

  <div id="quotationsBody" hidden>
    <div class="admin-toolbar">
      <button type="button" class="btn btn--primary" id="newQuoteBtn" style="padding:8px 16px; font-size:13px;">+ New quotation</button>
      <select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option></select>
    </div>
    <div id="quotesList"></div>
  </div>
</main>

<div class="detail-panel" id="detailPanel" hidden role="dialog" aria-modal="true" aria-label="Quotation details"></div>

<script type="module" src="js/quotations.js"></script>
</body>
</html>
