<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gallery — Lina's</title>
<link rel="icon" href="/assets/source/brand/Linas_Favicon.jpg">
<link rel="stylesheet" href="/assets/mockups/working/prototype-v2/styles.css">
</head>
<body>


<header class="site-header">
  <a class="site-header__mark" href="/">
    <img src="/assets/mockups/working/media/linas-logo-nb-wl.svg" alt="Lina's Mobile Food Kitchen" width="4678" height="3307" class="site-header__logo">
  </a>
  <div class="site-header__right">
    <button class="nav-toggle" id="navToggle" aria-haspopup="true" aria-controls="siteNav" aria-label="Open menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="nav-backdrop" id="navBackdrop" hidden></div>
<nav class="site-nav" id="siteNav" hidden aria-label="Site navigation">
  <button class="site-nav__close" id="navClose" aria-label="Close menu">Close ✕</button>
  <a href="/">Home</a>
  <a href="/catering">Catering</a>
  <a href="/menu">Menu</a>
  <a href="/chef-lina">About Lina's</a>
  <a href="/contact" class="site-nav__cta">Contact</a>
  <a href="/admin/login.html" id="navLogin" class="site-nav__login">Login</a>
</nav>

<main>
  <section class="section" style="padding-top:calc(var(--space-16) + 40px);">
    <h1 class="section-title">From the trailer</h1>
    <p class="section-lede">Every image here is confirmed genuine — carrying Lina's own <code>@chef_lina_moek</code> watermark.</p>
  </section>

  <div class="gallery-grid" id="galleryGrid">
    <button class="gallery-grid__item gallery-grid__item--tall" data-full="/assets/mockups/working/media/lina-gallery-frame-05-signage-working-v1-20260728.jpg" data-caption="Lina's trailer at a private catering event">
      <img src="/assets/mockups/working/media/lina-gallery-frame-05-signage-working-v1-20260728.jpg" alt="Lina's trailer at a private catering event" loading="lazy">
    </button>
    <button class="gallery-grid__item" data-full="/assets/mockups/working/media/lina-chef-trailer-frame-working-v1-20260728.jpg" data-caption="Chef Lina presenting a finished plate">
      <img src="/assets/mockups/working/media/lina-chef-trailer-frame-working-v1-20260728.jpg" alt="Chef Lina presenting a finished plate" loading="lazy">
    </button>
    <div class="gallery-grid__item gallery-grid__item--video" data-video-src="/assets/mockups/working/media/lina-gallery-clip-01-working-v1-20260728.mp4" data-poster="/assets/mockups/working/media/lina-gallery-frame-04-working-v1-20260728.jpg" data-caption="Bowl of glazed chicken pieces">
      <img src="/assets/mockups/working/media/lina-gallery-frame-04-working-v1-20260728.jpg" alt="" loading="lazy">
      <button class="gallery-grid__play" aria-label="Play video: bowl of glazed chicken pieces">▶</button>
    </div>
    <button class="gallery-grid__item" data-full="/assets/mockups/working/media/lina-gallery-frame-02-working-v1-20260728.jpg" data-caption="Plate being assembled: stew, potato salad, spinach and bread">
      <img src="/assets/mockups/working/media/lina-gallery-frame-02-working-v1-20260728.jpg" alt="Plate being assembled: stew, potato salad, spinach and bread" loading="lazy">
    </button>
    <button class="gallery-grid__item gallery-grid__item--tall" data-full="/assets/mockups/working/media/lina-gallery-frame-03-working-v1-20260728.jpg" data-caption="Catering event table with plated food">
      <img src="/assets/mockups/working/media/lina-gallery-frame-03-working-v1-20260728.jpg" alt="Catering event table with plated food" loading="lazy">
    </button>
    <button class="gallery-grid__item" data-full="/assets/mockups/working/media/lina-preparation-frame-working-v1-20260728.jpg" data-caption="Chakalaka and spinach being prepared at the trailer">
      <img src="/assets/mockups/working/media/lina-preparation-frame-working-v1-20260728.jpg" alt="Chakalaka and spinach being prepared at the trailer" loading="lazy">
    </button>
    <button class="gallery-grid__item gallery-grid__item--placeholder" aria-label="More photos coming soon" disabled>
      <span>More photos coming soon</span>
    </button>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox__close" id="lightboxClose" aria-label="Close photo viewer">Close ✕</button>
    <img id="lightboxImage" src="" alt="">
    <p id="lightboxCaption" class="lightbox__caption"></p>
  </div>
</main>

<button class="sticky-whatsapp" id="stickyWhatsapp" data-whatsapp-trigger aria-describedby="whatsappNote">💬 WhatsApp</button>
<p class="whatsapp-note" id="whatsappNote" role="status" aria-live="polite"></p>

<script src="/assets/mockups/working/prototype-v2/menu-data.js"></script>
<script src="/assets/mockups/working/prototype-v2/script.js"></script>
<script type="module" src="/assets/mockups/working/prototype-v2/public-admin-link.js"></script>
<script src="/assets/mockups/working/prototype-v2/preview-exit.js" defer></script>
</body>
</html>
