<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu — Lina's</title>
<link rel="icon" href="/assets/source/brand/Linas_Favicon.jpg">
<link rel="stylesheet" href="/assets/mockups/working/prototype-v2/styles.css">
</head>
<body class="menu-page">


<header class="site-header">
  <a class="site-header__mark" href="/">
    <img src="/assets/mockups/working/media/linas-logo-nb-wl.svg" alt="Lina's Mobile Food Kitchen" width="4678" height="3307" class="site-header__logo">
  </a>
  <div class="site-header__right">
    <button class="nav-toggle" id="navToggle" aria-haspopup="true" aria-controls="siteNav" aria-label="Open menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="nav-backdrop" id="navBackdrop" hidden></div>
<nav class="site-nav" id="siteNav" hidden aria-label="Site navigation">
  <button class="site-nav__close" id="navClose" aria-label="Close menu">Close ✕</button>
  <a href="/">Home</a>
  <a href="/catering">Catering</a>
  <a href="/menu" aria-current="page">Menu</a>
  <a href="/chef-lina">About Lina's</a>
  <a href="/contact" class="site-nav__cta">Contact</a>
  <a href="/admin/login.html" id="navLogin" class="site-nav__login">Login</a>
</nav>

<main>
  <section class="menu-hero" aria-label="Today's menu">
    <div class="menu-hero__grid">
      <div class="menu-hero__copy">
        <p class="menu-hero__eyebrow">Today's Menu</p>
        <h1 class="menu-hero__title">Every item, exactly as written on Lina's own menu.</h1>
      </div>
      <div class="menu-hero__media">
        <img src="/assets/mockups/working/media/lina-preparation-frame-working-v1-20260728.jpg" alt="Chakalaka and spinach being prepared at the trailer">
      </div>
    </div>
  </section>

  <section class="section menu-categories" aria-label="Menu">
    <noscript>
      <div class="section" style="padding:0;">
        <p><strong>JavaScript is off — showing the plain menu list:</strong></p>
        <ul>
          <li>Plates (R60 each): Short-rib, chakalaka, potato salad · Braised chicken, dombolo, spinach, potato salad · Beef stew, potato salad, spinach</li>
          <li>Kota: Chips/½ vienna/polony/atchar R25 · Chips/cheese/½ russian &amp; vienna/polony R30 · Chips/full russian/full vienna/cheese/polony/egg R50 · 4 slice with butter R10 · 3 slices/chips/½ russian R12</li>
          <li>Chips &amp; Snacks: Small R15 · Medium R25 · Large R30 · Vienna R10 · Russian R15 · Noodles R10</li>
          <li>Drinks: Juice R17 · Energy drinks R12 · Cold drinks R14 · 2 litre cold drinks R27</li>
        </ul>
      </div>
    </noscript>
    <div class="menu__tabs" role="tablist" aria-label="Menu categories" id="menuTabs"></div>
    <div class="menu__grid" id="menuGrid"></div>
  </section>
</main>

<button class="sticky-whatsapp sticky-whatsapp--icon" id="stickyWhatsapp" data-whatsapp-trigger aria-label="Contact Lina's on WhatsApp" aria-describedby="whatsappNote">
  <svg class="sticky-whatsapp__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2C6.48 2 2 6.24 2 11.5c0 1.94.6 3.74 1.63 5.24L2 22l5.46-1.57A10.4 10.4 0 0 0 12 21c5.52 0 10-4.24 10-9.5S17.52 2 12 2Zm5.16 13.13c-.22.62-1.28 1.18-1.77 1.24-.45.06-1.02.09-1.65-.1-.38-.12-.87-.28-1.5-.55-2.64-1.15-4.36-3.83-4.5-4.01-.13-.18-1.08-1.44-1.08-2.74 0-1.3.68-1.94.92-2.2.24-.26.53-.33.7-.33h.5c.16 0 .38-.03.58.44l.72 1.77c.06.14.1.3.02.48-.08.18-.12.29-.24.44l-.36.42c-.12.12-.24.25-.1.5.13.24.6 1 1.29 1.62.9.8 1.65 1.05 1.9 1.17.24.12.38.1.53-.06l.63-.72c.2-.23.4-.19.66-.1.27.1 1.68.79 1.97.93.28.15.47.22.53.35.07.13.07.71-.15 1.33Z"/></svg>
  <span class="sticky-whatsapp__label">WhatsApp</span>
</button>
<p class="whatsapp-note" id="whatsappNote" role="status" aria-live="polite"></p>

<script src="/assets/mockups/working/prototype-v2/menu-data.js"></script>
<!-- cart.js must load BEFORE script.js: script.js checks for window.LINA_CART
     when it renders the menu grid, and needs it to exist to draw Add buttons. -->
<script src="/assets/mockups/working/prototype-v2/cart.js"></script>
<script src="/assets/mockups/working/prototype-v2/script.js"></script>
<script type="module" src="/assets/mockups/working/prototype-v2/public-admin-link.js"></script>
<script src="/assets/mockups/working/prototype-v2/preview-exit.js" defer></script>
</body>
</html>
